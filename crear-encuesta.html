<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Encuesta - Sistema de Encuestas</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Sistema de Encuestas de Software</h1>
            <p>Gestión de Formularios Dinámicos</p>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="crear-encuesta.html">Crear encuesta</a>
                <a href="contacto.html">Contáctenos</a>
            </nav>
        </header>

        <main>
            <h2>Nueva Encuesta de Satisfacción de Software</h2>
            <p>Diligencia los campos a continuación para evaluar el rendimiento del sistema y la experiencia del usuario.</p>
            
            <form action="#" method="POST" class="encuesta-form">
                <!-- Pregunta 1: Nombre del Proyecto -->
                <div class="form-group">
                    <label for="nombre-proyecto">Nombre del Proyecto de Software:</label>
                    <input type="text" id="nombre-proyecto" name="nombre-proyecto" required placeholder="Ej. Aplicativo Móvil Alfa">
                </div>

                <!-- Pregunta 2: Rol -->
                <div class="form-group">
                    <label for="rol-usuario">Rol del Evaluador:</label>
                    <select id="rol-usuario" name="rol-usuario" required>
                        <option value="" disabled selected>Seleccione un rol</option>
                        <option value="desarrollador">Desarrollador / QA</option>
                        <option value="cliente">Cliente Final</option>
                        <option value="administrador">Administrador del Sistema</option>
                    </select>
                </div>

                <!-- Pregunta 3: Rendimiento -->
                <div class="form-group">
                    <label for="rendimiento">¿Cómo califica el rendimiento y velocidad del software?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="rendimiento" value="Excelente"> Excelente</label>
                        <label><input type="radio" name="rendimiento" value="Bueno"> Bueno</label>
                        <label><input type="radio" name="rendimiento" value="Regular"> Regular / Lento</label>
                    </div>
                </div>

                <!-- Pregunta 4: Interfaz Gráfica (UI/UX) -->
                <div class="form-group">
                    <label for="diseño-ui">¿Qué tan intuitivo le parece el diseño visual de la interfaz?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="diseño-ui" value="Muy Intuitivo"> Muy Intuitivo</label>
                        <label><input type="radio" name="diseño-ui" value="Aceptable"> Aceptable</label>
                        <label><input type="radio" name="diseño-ui" value="Confuso"> Confuso / Difícil</label>
                    </div>
                </div>

                <!-- Pregunta 5: Frecuencia de Errores (Bugs) -->
                <div class="form-group">
                    <label for="errores-sistema">¿Con qué frecuencia ha experimentado caídas o errores (bugs) en el sistema?</label>
                    <select id="errores-sistema" name="errores-sistema" required>
                        <option value="" disabled selected>Seleccione una opción</option>
                        <option value="Nunca">Nunca he tenido problemas</option>
                        <option value="Raras veces">Raras veces / Errores menores</option>
                        <option value="Frecuentemente">Frecuentemente / Bloquea el uso</option>
                    </select>
                </div>

                <!-- Pregunta 6: Seguridad y Confianza -->
                <div class="form-group">
                    <label for="seguridad">¿Qué nivel de confianza tiene respecto al manejo y seguridad de los datos?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="seguridad" value="Alto"> Alto</label>
                        <label><input type="radio" name="seguridad" value="Medio"> Medio</label>
                        <label><input type="radio" name="seguridad" value="Bajo"> Bajo</label>
                    </div>
                </div>

                <!-- Pregunta 7: Comentarios -->
                <div class="form-group">
                    <label for="comentarios">Comentarios o sugerencias de mejora:</label>
                    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escriba aquí los bugs encontrados o mejoras de UX..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Guardar y Enviar Encuesta</button>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 - Desarrollado por Jhon Madrid</p>
        </footer>
    </div>

    <!-- JavaScript para procesar la encuesta -->
    <script>
        document.querySelector('.encuesta-form').addEventListener('submit', function(e) {
            e.preventDefault(); 

            const proyecto = document.getElementById('nombre-proyecto').value;
            const rol = document.getElementById('rol-usuario').value;
            const rendimiento = document.querySelector('input[name="rendimiento"]:checked')?.value || 'No especificado';
            const disenoUi = document.querySelector('input[name="diseño-ui"]:checked')?.value || 'No especificado';
            const errores = document.getElementById('errores-sistema').value;

            alert(`✨ ¡Encuesta Guardada con Éxito! ✨\n\nProyecto: ${proyecto}\nRol: ${rol}\nRendimiento: ${rendimiento}\nDiseño UI/UX: ${disenoUi}\nErrores: ${errores}\n\nGracias por registrar los datos en el Sistema.`);
            
            this.reset();
        });
    </script>
</body>
</html>
