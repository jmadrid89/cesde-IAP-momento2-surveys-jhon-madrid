<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Encuesta - Sistema de Encuestas</title>
    <!-- Ruta corregida apuntando a la carpeta styles -->
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Sistema de Encuestas de Software</h1>
            <p>Gestión de Formularios Dinámicos</p>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="crear-encuesta.html">Crear encuesta</a>
                <a href="contacto.html">Contáctenos</a>
            </nav>
        </header>

        <main>
            <h2>Nueva Encuesta de Satisfacción de Software</h2>
            <p>Diligencia los campos a continuación para evaluar el rendimiento del sistema y la experiencia del usuario.</p>
            
            <form action="#" method="POST" class="encuesta-form">
                <div class="form-group">
                    <label for="nombre-proyecto">Nombre del Proyecto de Software:</label>
                    <input type="text" id="nombre-proyecto" name="nombre-proyecto" required placeholder="Ej. Aplicativo Móvil Alfa">
                </div>

                <div class="form-group">
                    <label for="rol-usuario">Rol del Evaluador:</label>
                    <select id="rol-usuario" name="rol-usuario" required>
                        <option value="" disabled selected>Seleccione un rol</option>
                        <option value="desarrollador">Desarrollador / QA</option>
                        <option value="cliente">Cliente Final</option>
                        <option value="administrador">Administrador del Sistema</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="rendimiento">¿Cómo califica el rendimiento y velocidad del software?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="rendimiento" value="Excelente"> Excelente</label>
                        <label><input type="radio" name="rendimiento" value="Bueno"> Bueno</label>
                        <label><input type="radio" name="rendimiento" value="Regular"> Regular / Lento</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios o sugerencias de mejora:</label>
                    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escriba aquí los bugs encontrados o mejoras de UX..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Guardar y Enviar Encuesta</button>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 - Desarrollado por Jhon Madrid</p>
        </footer>
    </div>

    <!-- Funcionalidad melita para procesar los datos sin recargar la página -->
    <script>
        document.querySelector('.encuesta-form').addEventListener('submit', function(e) {
            e.preventDefault(); 

            // Capturamos los datos del formulario
            const proyecto = document.getElementById('nombre-proyecto').value;
            const rol = document.getElementById('rol-usuario').value;
            const rendimiento = document.querySelector('input[name="rendimiento"]:checked')?.value || 'No especificado';
            const comentarios = document.getElementById('comentarios').value;

            // Alerta elegante con los datos ingresados
            alert(`✨ ¡Encuesta Guardada con Éxito! ✨\n\nProyecto: ${proyecto}\nRol: ${rol}\nRendimiento: ${rendimiento}\n\nGracias por registrar los datos en el Sistema.`);
            
            // Limpiamos los campos automáticamente
            this.reset();
        });
    </script>
</body>
</html>
