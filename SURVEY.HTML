<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Encuesta - Sistema de Encuestas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; }
    </style>
</head>
<body class="bg-light text-dark">

    <header class="bg-secondary text-white text-center py-4 shadow-sm">
        <h1 class="fw-bold">Sistema de Encuestas de Software</h1>
        <p class="lead">Proyecto Integrador - Semestre 1</p>
        <nav class="mt-3">
            <a href="index.html" class="btn btn-sm btn-outline-light mx-1">Inicio</a>
            <a href="survey.html" class="btn btn-sm btn-light mx-1 fw-bold">Crear encuesta</a>
            <a href="contact-us.html" class="btn btn-sm btn-outline-light mx-1">Contáctenos</a>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 600px;">
        <div class="bg-white p-4 rounded shadow-sm border">
            <h2 class="text-center mb-4 text-secondary">Encuesta Tecnológica</h2>
            <form>
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold">Nombre del Encuestado:</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ej. Jhon Madrid" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Correo Electrónico:</label>
                    <input type="email" class="form-control" id="email" placeholder="nombre@correo.com" required>
                </div>
                <div class="mb-3">
                    <label for="lenguaje" class="form-label fw-bold">¿Cuál es tu lenguaje de programación favorito?</label>
                    <select class="form-select" id="lenguaje" required>
                        <option value="" selected disabled>Selecciona una opción...</option>
                        <option value="html-css">HTML5 / CSS3</option>
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="sql">SQL Server</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold d-block">Herramientas que dominas:</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="git" value="git">
                        <label class="form-check-label" for="git">Git / GitHub</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="bootstrap" value="bootstrap">
                        <label class="form-check-label" for="bootstrap">Bootstrap</label>
                    </div>
                </div>
                <div class="mt-4 d-flex justify-content-between">
                    <button type="submit" class="btn btn-success px-4">Enviar Encuesta</button>
                    <a href="index.html" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="text-center py-3 bg-dark text-white-50 mt-auto">
        <div class="container">
            <small>&copy; 2026 - Desarrollado por Jhon Madrid</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
